# OTel Collector pipeline config.
# Per docs/strategy/local-lab-STRATEGY.md §3 + the dashboard backend strategy:
# the Collector is the single ingest point; it fans out to Postgres (always)
# and to optional Prometheus / Tempo backends if env vars are set.

receivers:
   otlp:
      protocols:
         http:
            endpoint: 0.0.0.0:4318
         grpc:
            endpoint: 0.0.0.0:4317

extensions:
   health_check:
      endpoint: 0.0.0.0:13133

processors:
   # Drop spans without our required attributes — defends against mis-instrumented
   # clients (per design §4.2).
   filter/sanity:
      error_mode: ignore
      traces:
         span:
            - 'attributes["agent.user.id"] == nil'
            - 'attributes["agent.harness.name"] == nil'

   # Strip any prompt/completion/tool-args attributes that may have leaked through
   # the extension's privacy fence. Defense in depth (per design §7.3).
   attributes/redact:
      actions:
         - { key: gen_ai.prompt,         action: delete }
         - { key: gen_ai.completion,     action: delete }
         - { key: gen_ai.tool_arguments, action: delete }
         - { key: gen_ai.tool_call.arguments, action: delete }

   batch:
      timeout: 5s
      send_batch_size: 512

exporters:
   # Lab default: log everything to stdout. Replaced by postgres exporter once
   # the Collector image with the postgres connector lands (see below).
   debug:
      verbosity: detailed
      sampling_initial: 5
      sampling_thereafter: 200

   # File exporter: writes spans as JSONL to a mounted volume. Used by the
   # seeder's bridge and as a fallback log of last resort. Cheap, reliable.
   file/spans:
      path: /var/log/otel/spans.jsonl
      rotation:
         max_megabytes: 10
         max_backups: 5

service:
   extensions: [health_check]
   telemetry:
      logs:
         level: info
   pipelines:
      traces:
         receivers:  [otlp]
         processors: [filter/sanity, attributes/redact, batch]
         exporters:  [debug, file/spans]
      metrics:
         receivers:  [otlp]
         processors: [batch]
         exporters:  [debug]
