# Provisioned data source: token_tracker Postgres.
# Per docs/strategy/local-lab-STRATEGY.md §3.1, Grafana is the ops/exploration
# surface; Postgres is the source of truth.

apiVersion: 1

datasources:
  - name: token_tracker
    uid: token_tracker
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    isDefault: true
    editable: true
