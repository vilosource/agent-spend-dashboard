# Production-shaped Docker Compose recipe for the reference dashboard server.
#
# Per docs/strategy/local-lab-STRATEGY.md §4.2, this file is what a small
# organization would deploy on a single VM. Every value an organization
# would change is parameterized (see .env.example).
#
# When the lab uses this file (via `make lab` from the repo root), the
# sibling compose.override.yml adds lab-only ergonomics: hardcoded
# credentials, exposed ports, the seeder/bridge services.

name: agent-spend

services:
   postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-agent_spend}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
         POSTGRES_DB: ${POSTGRES_DB:-agent_spend}
      volumes:
         - pg-data:/var/lib/postgresql/data
         - ./postgres/init:/docker-entrypoint-initdb.d:ro
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_spend}"]
         interval: 5s
         timeout: 5s
         retries: 10

   collector:
      image: otel/opentelemetry-collector-contrib:0.117.0
      restart: unless-stopped
      command: ["--config=/etc/otel/config.yaml"]
      volumes:
         - ./collector/config.yaml:/etc/otel/config.yaml:ro
         - otel-spans:/var/log/otel
      depends_on:
         postgres:
            condition: service_healthy
      # The otelcol-contrib image has no curl/wget; in-container HTTP healthchecks
      # are not feasible. We rely on dependents using `condition: service_started`
      # and on the collector's own log output to confirm readiness. The Makefile's
      # wait-healthy target uses Compose status (not a host probe) since the
      # collector's :13133 health endpoint is not exposed to the host.

   api:
      # Agent Spend API + SPA + OTLP ingest (per docs/design/api-and-spa-DESIGN.md).
      # Phase 0.3.3 — /health, /, and /auth/{login,callback,logout} are
      # implemented; /api/*, /v1/traces land in subsequent phases.
      #
      # The AGENT_SPEND_* prefix on app-specific env vars is an explicit
      # convention so deploying organizations don't have to namespace
      # generic-sounding names like JWT_SECRET against their other apps.
      build:
         context: ../..
         dockerfile: packages/api/Dockerfile
      restart: unless-stopped
      environment:
         PORT: 8080
         PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
         DATABASE_URL: postgresql://${POSTGRES_USER:-agent_spend}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_spend}
         AGENT_SPEND_JWT_SECRET: ${AGENT_SPEND_JWT_SECRET:?set AGENT_SPEND_JWT_SECRET in .env}
         AGENT_SPEND_OIDC_ISSUER_URL: ${AGENT_SPEND_OIDC_ISSUER_URL:?set AGENT_SPEND_OIDC_ISSUER_URL in .env}
         AGENT_SPEND_OIDC_CLIENT_ID: ${AGENT_SPEND_OIDC_CLIENT_ID:?set AGENT_SPEND_OIDC_CLIENT_ID in .env}
         AGENT_SPEND_OIDC_CLIENT_SECRET: ${AGENT_SPEND_OIDC_CLIENT_SECRET:?set AGENT_SPEND_OIDC_CLIENT_SECRET in .env}
      depends_on:
         postgres:
            condition: service_healthy
      healthcheck:
         test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 5s

   grafana:
      image: grafana/grafana-oss:11.4.0
      restart: unless-stopped
      environment:
         GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
         GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
         GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
         # Pass the Postgres credentials through so the provisioned datasource
         # can interpolate them.
         POSTGRES_USER: ${POSTGRES_USER:-agent_spend}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
         POSTGRES_DB: ${POSTGRES_DB:-agent_spend}
      volumes:
         - grafana-data:/var/lib/grafana
         - ./grafana/provisioning:/etc/grafana/provisioning:ro
         - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      depends_on:
         postgres:
            condition: service_healthy

volumes:
   pg-data:
   otel-spans:
   grafana-data:
