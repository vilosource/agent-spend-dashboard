# Lab-only overrides for compose.yml.
#
# Per docs/strategy/local-lab-STRATEGY.md §4.2: this file is loaded
# automatically by `docker compose` when in the same directory. It
# adds dev-friendly behavior (hardcoded creds, exposed ports) and
# the bridge + seeder services that are not part of the production
# recipe.
#
# A production deployment uses compose.yml WITHOUT this override.

name: token-tracker

# Port mapping policy (per the "do we need to expose Postgres" discussion):
#
#   Tier 1 — always exposed (real user-facing surfaces):
#     7000  Grafana       (browser)
#     7080  API           (browser; also the OTLP /v1/traces target for host pi)
#     7019  lab IdP       (browser, for the SPA's MSAL flow; the api reaches it over compose DNS at idp:5556)
#
#   Tier 2 — lab-only regression fixture for the standard OTel pipeline:
#     7018  OTel Collector OTLP/HTTP   (used by the seeder + ad-hoc pipeline tests; the API's /v1/traces is the real path)
#
#   Tier 3 — not exposed; Compose-internal only:
#     Postgres            → use `make psql` (which does docker compose exec)
#     OTLP gRPC :4317     → no consumer
#     Collector health    → wait-healthy in Makefile uses Compose status, not host probe
#
# All container-internal ports stay at their defaults so service-to-service
# DNS works (postgres:5432, collector:4318, grafana:3000, api:8080, idp:5556).
# Only the host-side mapping changes.

services:
   postgres:
      environment:
         POSTGRES_USER: token_tracker
         POSTGRES_PASSWORD: dev
         POSTGRES_DB: token_tracker
      # No host port mapping — use `make psql` for ad-hoc queries.

   # OTel Collector — LAB-ONLY since phase 0.3.8 (D6 sunset complete).
   # The production recipe (compose.yml) runs the API's /v1/traces
   # endpoint directly. We keep the Collector here as a regression
   # fixture for the standard OTel pipeline (filter / redact / batch
   # / file exporter) so we can catch behaviour drift if a deploying
   # organisation chains the API behind their existing Collector.
   #
   # Host port :7018 OTLP/HTTP is preserved for the seeder + any
   # ad-hoc experiments. After 0.3.7 the host's pi extension targets
   # :7080/v1/traces (the API), not :7018.
   collector:
      image: otel/opentelemetry-collector-contrib:0.117.0
      restart: unless-stopped
      command: ["--config=/etc/otel/config.yaml"]
      volumes:
         - ./collector/config.yaml:/etc/otel/config.yaml:ro
         - otel-spans:/var/log/otel
      depends_on:
         postgres:
            condition: service_healthy
      ports:
         - "7018:4318"   # OTLP/HTTP — used by the seeder and by any
                          # regression test that wants to push through the
                          # full Collector → bridge → Postgres pipeline.
      # The collector image runs as a non-root user but the otel-spans
      # volume is root-owned by Docker on first creation. Run as root in
      # the lab to keep the file/spans exporter working without volume
      # permission gymnastics.
      user: "0:0"

   # Bridge: tails the Collector's JSONL output and inserts into Postgres.
   # Kept in the lab as a regression fixture for the standard OTel pipeline;
   # production ingest is the API's /v1/traces. Both write to usage_log.
   bridge:
      build: ../../lab/bridge
      restart: unless-stopped
      depends_on:
         collector:
            condition: service_started
         postgres:
            condition: service_healthy
      environment:
         BRIDGE_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
         BRIDGE_SPANS: /var/log/otel/spans.jsonl
      volumes:
         - otel-spans:/var/log/otel:ro

   # Seeder: one-shot service. Run via `make seed` (which executes
   # `docker compose run --rm seeder` with whatever args you want).
   seeder:
      build: ../../lab/seed
      profiles: ["seed"]   # Don't auto-start; only on explicit `run`
      depends_on:
         collector:
            condition: service_started
      environment:
         OTEL_ENDPOINT: http://collector:4318
      command: ["--endpoint", "http://collector:4318", "--days", "7", "--users", "10"]

   # Grafana — dev creds + exposed port + anonymous viewer access for the lab.
   grafana:
      environment:
         GRAFANA_ADMIN_USER: admin
         GRAFANA_ADMIN_PASSWORD: admin
         GRAFANA_ANONYMOUS: "true"
         GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
         # Don't show the "complete the setup" or sign-up nag in the lab.
         GF_USERS_ALLOW_SIGN_UP: "false"
         GF_NEWS_NEWS_FEED_ENABLED: "false"
      ports:
         - "7000:3000"

   # API service — host port 7080. Container internal port stays at 8080.
   api:
      # The SPA is built into this image at `vite build` time, so the SPA's
      # MSAL config is baked here via build args (production deployments pass
      # their own). Note: MSAL.js requires an https:// authority — these HTTP
      # lab values let the SPA show a "SPA login needs an HTTPS IdP" note
      # (rather than "auth not configured"); they don't make the browser login
      # flow work here. The API-side path (/api/me, /v1/traces, verification)
      # works fine over HTTP — see `make smoke`. API_SCOPE is whatever the IdP
      # maps to an access token with aud=token-tracker-api.
      build:
         args:
            VITE_TOKEN_TRACKER_AUTHORITY: http://localhost:7019
            VITE_TOKEN_TRACKER_CLIENT_ID: token-tracker-spa
            VITE_TOKEN_TRACKER_API_SCOPE: api://token-tracker-api/access_as_user
            VITE_TOKEN_TRACKER_REDIRECT_URI: http://localhost:7080
      environment:
         # PUBLIC_URL is what the BROWSER uses to reach this API — it must match
         # the host-side mapping (7080), not the container-internal port (8080).
         PUBLIC_URL: http://localhost:7080
         # The api reaches the IdP over the compose network (idp:5556) to fetch
         # the discovery doc; the doc's `issuer` is http://localhost:7019 (what
         # the browser used, so MSAL is happy) and its `jwks_uri` is the
         # caller-relative http://idp:5556/jwks (so the api can fetch the keys).
         # Pure resource server: no client secret, no JWT-signing secret.
         # Production deployments set these via the deploying org's secret store.
         TOKEN_TRACKER_OIDC_ISSUER_URL: http://idp:5556
         TOKEN_TRACKER_OIDC_CLIENT_ID: token-tracker-api
      ports:
         - "7080:8080"
      depends_on:
         idp:
            condition: service_healthy

   # Lab OIDC IdP — a tiny purpose-built provider (lab/idp/server.mjs, zero
   # npm deps). Replaces Dex: Dex's static-password connector can't emit the
   # app-role claims the API reads. Three hardcoded identities — lab-admin
   # (TokenTracker.Admin), lab-user (TokenTracker.User), lab-viewer
   # (TokenTracker.Viewer); no passwords. See lab/idp/README.md.
   idp:
      build: ../../lab/idp
      restart: unless-stopped
      environment:
         # The issuer the browser uses (host port 7019). The api fetches the
         # discovery doc over compose DNS (idp:5556); the doc still advertises
         # this as the `issuer`, and a caller-relative `jwks_uri`.
         ISSUER: http://localhost:7019
         API_AUDIENCE: token-tracker-api
      ports:
         - "7019:5556"
      healthcheck:
         test: ["CMD", "node", "-e", "fetch('http://localhost:5556/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
         interval: 5s
         timeout: 3s
         retries: 10
         start_period: 3s

# Lab-only volumes. otel-spans is the JSONL pipe between the Collector's
# file exporter and the bridge — only used when the regression-test
# pipeline runs.
volumes:
   otel-spans:
